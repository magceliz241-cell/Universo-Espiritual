[package]
name = "su-ephem"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Wrapper WASM do Seu Universo sobre o XALEN Ephemeris: posições aparentes e casas no referencial verdadeiro de data"

[lib]
crate-type = ["cdylib", "rlib"]

# XALEN fixado por commit. default-features = false em todos: o catálogo
# Hipparcos (xalen-stars-hip-data, CC-BY-NC) NÃO pode ser linkado.
[dependencies]
xalen-ephem = { git = "https://github.com/vedika-io/xalen-ephemeris", rev = "cc6edbec1f748ebdc4950ae6198f575c5ada73fa", default-features = false }
xalen-houses = { git = "https://github.com/vedika-io/xalen-ephemeris", rev = "cc6edbec1f748ebdc4950ae6198f575c5ada73fa", default-features = false }
xalen-coords = { git = "https://github.com/vedika-io/xalen-ephemeris", rev = "cc6edbec1f748ebdc4950ae6198f575c5ada73fa", default-features = false }
xalen-time = { git = "https://github.com/vedika-io/xalen-ephemeris", rev = "cc6edbec1f748ebdc4950ae6198f575c5ada73fa", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
